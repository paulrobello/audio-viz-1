name: Deploy to GitHub Pages

# Builds the single-file Vite app and deploys dist/ to GitHub Pages on every push to main.
# Pages is configured (repo Settings → Pages) with the "GitHub Actions" build source and a
# custom domain of pardev.net.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # required for the OIDC deploy-pages action

# One Pages deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'   # Vite 8 requires Node ^20.19 || >=22.12
          cache: npm
      - run: npm ci
      - run: npm run build     # -> dist/index.html (single-file PWA)
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
