<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RESOMANCE — Audio-Reactive Visualizer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #000; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #gl { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 18px; opacity: 0; transition: opacity .4s ease;
  }
  #ui.show { opacity: 1; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel {
    pointer-events: auto;
    background: rgba(8,10,18,.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(140,170,255,.18); border-radius: 12px;
    padding: 12px 14px; color: #cdd6ff; font-size: 12px; line-height: 1.5;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  button, label.btn {
    pointer-events: auto; cursor: pointer; user-select: none;
    background: linear-gradient(180deg, rgba(80,110,255,.25), rgba(40,60,180,.18));
    border: 1px solid rgba(150,180,255,.35); color: #eaf0ff;
    padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 12px;
    transition: transform .08s ease, background .2s ease;
  }
  button:hover, label.btn:hover { background: linear-gradient(180deg, rgba(110,140,255,.4), rgba(60,90,220,.28)); }
  button:active { transform: translateY(1px) scale(.99); }
  input[type=file] { display: none; }
  .seg { display:flex; gap:0; border:1px solid rgba(150,180,255,.3); border-radius:9px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:8px 10px; background:rgba(20,26,48,.6); font-size:11px; opacity:.7; }
  .seg button.on { background:linear-gradient(180deg,rgba(110,140,255,.45),rgba(60,90,220,.3)); opacity:1; }

  #title { font-weight: 700; letter-spacing: .18em; font-size: 13px; color: #aebeff; }
  #sub { color: #8a96c8; font-size: 11px; letter-spacing: .04em; }
  .meter { display: inline-flex; gap: 3px; align-items: flex-end; height: 26px; }
  .meter i { width: 5px; background: linear-gradient(180deg,#6f8bff,#b76bff); border-radius: 2px; height: 2px; transition: height .05s linear; }
  .label { color:#7f8bc0; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color:#9aa6da; font-size:11px; letter-spacing:.1em; opacity:0; pointer-events:none;
    text-align:center; transition: opacity .4s ease; }
  #hint.show { opacity:.7; }
  /* hidden HUD must not intercept clicks (e.g. after the idle fade-out) */
  #ui:not(.show) * { pointer-events: none; }
  #err {
    position: fixed; inset: auto 16px 16px 16px; max-width: 760px; margin: 0 auto;
    background: #2a0d12; border: 1px solid #ff5d6c; color: #ffd7db;
    padding: 14px 16px; border-radius: 12px; font-size: 12px; white-space: pre-wrap;
    display: none; pointer-events: auto; z-index: 50;
  }
  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,80,.35); border: 2px dashed rgba(150,180,255,.5);
    color: #dfe6ff; font-size: 18px; letter-spacing: .1em; z-index: 40; pointer-events: none;
  }
  #drop.on { display: flex; }
  select { pointer-events:auto; background: rgba(20,26,48,.8); color:#dfe6ff; border:1px solid rgba(150,180,255,.3); border-radius:8px; padding:6px 8px; font:inherit; font-size:12px; }

  /* volume slider */
  .vol { display:flex; align-items:center; gap:8px; }
  input[type=range] {
    pointer-events:auto; -webkit-appearance:none; appearance:none;
    width:110px; height:4px; border-radius:3px;
    background: linear-gradient(90deg,#6f8bff,#b76bff); outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background:#eaf0ff; border:2px solid #6f8bff; cursor:pointer; box-shadow:0 0 8px rgba(120,150,255,.8);
  }
  .chk { display:inline-flex; align-items:center; gap:6px; cursor:pointer; pointer-events:auto; font-size:11px; color:#cdd6ff; }
  .chk input { accent-color:#8a7bff; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div class="row" style="justify-content:space-between; align-items:flex-start;">
    <div class="panel">
      <div id="title">R E S O M A N C E</div>
      <div id="sub">audio-reactive visual field</div>
    </div>
    <div class="panel">
      <div class="row" style="margin-bottom:9px;">
        <label class="btn" for="file">⤓ Load audio</label>
        <button id="demo">▶ Demo synth</button>
        <button id="play">⏸ Pause</button>
      </div>
      <div class="row" style="margin-bottom:9px;">
        <span class="label">scene</span>
        <div class="seg" id="modeSeg">
          <button data-mode="0" class="on">Fractal</button>
          <button data-mode="1">Tunnel</button>
          <button data-mode="2">Plasma</button>
          <button data-mode="3">Vortex</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:9px;">
        <span class="label">palette</span>
        <select id="style">
          <option value="0">Aether</option>
          <option value="1">Plasma Tomb</option>
          <option value="2">Cold Circuit</option>
          <option value="3">Ember Bloom</option>
        </select>
        <label class="chk"><input type="checkbox" id="ring" checked /> spectrum ring</label>
        <label class="chk"><input type="checkbox" id="autohide" checked /> auto-hide HUD</label>
      </div>
      <div class="row">
        <div><div class="label">bass</div><div class="meter" id="mBass"></div></div>
        <div style="margin-left:14px;"><div class="label">mid</div><div class="meter" id="mMid"></div></div>
        <div style="margin-left:14px;"><div class="label">treble</div><div class="meter" id="mTreble"></div></div>
        <div class="vol" style="margin-left:18px;">
          <span class="label">vol</span>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" />
          <span id="volLbl" style="font-size:11px;color:#9aa6da;width:34px;text-align:right;">90%</span>
        </div>
      </div>
    </div>
  </div>
  <div></div>
</div>

<div id="hint">press <b>H</b> hide UI · drag an audio file anywhere · <b>1-4</b> scene · <b>space</b> play/pause · <b>R</b> ring</div>
<div id="drop">drop an audio file to visualize</div>
<div id="err"></div>

<input type="file" id="file" accept="audio/*" />

<script type="x-shader/x-vertex" id="vs">#version 300 es
in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<script type="x-shader/x-fragment" id="fsScene">#version 300 es
precision highp float;
out vec4 frag;

uniform vec2  u_res;
uniform float u_time;
uniform float u_bass;
uniform float u_mid;
uniform float u_treble;
uniform float u_level;
uniform float u_centroid;
uniform float u_beat;
uniform float u_style;
uniform float u_mode;
uniform float u_specOn;
uniform float u_reducedMotion;
uniform sampler2D u_prev;
uniform sampler2D u_spec;   // R8, 256x1 FFT magnitudes

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

vec3 palette(float t){
  vec3 a = vec3(0.5), b = vec3(0.5), c = vec3(1.0), d;
  if(u_style < 0.5){       d = vec3(0.00,0.33,0.67); }
  else if(u_style < 1.5){  d = vec3(0.30,0.20,0.55); a=vec3(0.6,0.4,0.5); }
  else if(u_style < 2.5){  d = vec3(0.55,0.55,0.85); a=vec3(0.4,0.5,0.6); }
  else {                   d = vec3(0.10,0.45,0.75); a=vec3(0.7,0.35,0.2); }
  return a + b*cos(6.28318*(c*t + d));
}

float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),       hash21(i+vec2(1,0)), u.x),
             mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=0.5; }
  return v;
}

// ---------- scene 0: kaleidoscopic IFS fractal ----------
float map0(vec3 p){
  p.xy *= rot(u_time*0.10 + u_beat*1.5);
  p.xz *= rot(u_time*0.07 - u_beat*0.8);
  float s = 2.0 + u_bass*1.4 + u_beat*0.6;
  vec3 offset = vec3(1.0 - u_mid*0.35, 1.0 - u_treble*0.35, 1.0);
  float scale = 1.0;
  for(int i=0;i<11;i++){
    p = abs(p);
    if(p.x < p.y) p.xy = p.yx;
    if(p.x < p.z) p.xz = p.zx;
    if(p.y < p.z) p.yz = p.zy;
    p = p*s - offset*(s-1.0);
    p.xy *= rot(0.27 + u_mid*0.5);
    scale *= s;
  }
  return (length(p) - 0.6) / scale;
}
vec3 sceneFractal(vec2 uv){
  float camDist = 3.6 - u_bass*1.1 - u_beat*0.4;
  vec3 ro = vec3(0.0, 0.0, camDist);
  ro.xz *= rot(u_time*0.12 + u_centroid*1.2);
  ro.y = sin(u_time*0.18)*0.6;
  vec3 fwd = normalize(-ro);
  vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up  = cross(fwd, rgt);
  vec3 rd = normalize(uv.x*rgt + uv.y*up + 1.4*fwd);

  float t = 0.0, glow = 0.0, steps = 0.0;
  bool hit = false; vec3 p = vec3(0.0);
  for(int i=0;i<90;i++){
    p = ro + rd*t;
    float d = map0(p);
    glow += exp(-d*7.0) * (0.012 + u_level*0.05);
    if(d < 0.0012){ hit = true; break; }
    t += d*0.9; steps += 1.0;
    if(t > 18.0) break;
  }
  vec3 col = vec3(0.0);
  if(hit){
    vec2 e = vec2(0.0009,0.0);
    vec3 n = normalize(vec3(map0(p+e.xyy)-map0(p-e.xyy), map0(p+e.yxy)-map0(p-e.yxy), map0(p+e.yyx)-map0(p-e.yyx)));
    vec3 lig = normalize(vec3(0.6,0.75,-0.45));
    float dif = clamp(dot(n,lig),0.0,1.0);
    float fre = pow(1.0-clamp(dot(n,-rd),0.0,1.0),3.0);
    float ao = 1.0 - steps/90.0;
    vec3 base = palette(u_centroid*0.6 + t*0.04 + u_time*0.04 + u_style*0.2);
    col = base*(0.18+0.9*dif)*ao + fre*palette(u_time*0.1+0.5)*(0.6+u_treble*1.4) + base*0.15*u_beat;
  } else {
    float r = length(uv);
    col = palette(u_centroid*0.5 + r*0.6 + u_time*0.03) * (0.04 + 0.10/(r+0.4)) * (0.4 + u_level);
    col += palette(u_time*0.05) * u_treble * 0.06;
  }
  col += glow * palette(u_time*0.08 + 0.3) * (1.0 + u_bass*2.0);
  return col;
}

// ---------- scene 1: hyperdrive tunnel ----------
vec3 sceneTunnel(vec2 uv){
  vec3 ro = vec3(sin(u_time*0.5)*0.3, cos(u_time*0.37)*0.3, 0.0) * (0.5 + u_bass);
  vec3 rd = normalize(vec3(uv, 1.3));
  float t = 0.0, glow = 0.0; bool hit = false; vec3 p = vec3(0.0);
  for(int i=0;i<70;i++){
    p = ro + rd*t;
    p.z += u_time*4.0;                 // fly forward
    float R = 1.6 + 0.25*sin(p.z*2.0 + u_time) + u_bass*0.6;
    float d = R - length(p.xy);        // >0 inside, <0 past wall
    glow += exp(-max(d,0.0)*3.0)*0.012 + exp(-abs(d)*9.0)*0.006;
    if(d < 0.02){ hit = true; break; }
    t += max(d*0.9, 0.015);
    if(t > 40.0) break;
  }
  vec3 col = vec3(0.0);
  if(hit){
    float ring = sin(p.z*1.5 + u_time*2.0)*0.5+0.5;
    vec3 base = palette(p.z*0.05 + u_time*0.06 + u_centroid);
    col = base*(0.25 + ring*0.85);
    col += palette(u_time*0.1) * u_treble * 0.5;
    col *= exp(-t*0.06);
  }
  col += glow * palette(u_time*0.2 + 0.4) * (1.0 + u_bass*1.5);
  return col;
}

// ---------- scene 2: liquid plasma ----------
vec3 scenePlasma(vec2 uv){
  vec2 st = uv * (1.6 + u_bass*0.6);
  st *= rot(u_time*0.05);
  vec2 q = vec2(fbm(st + 0.12*u_time), fbm(st + vec2(5.2,1.3) + 0.10*u_time));
  vec2 r = vec2(fbm(st + 3.5*q + vec2(1.7,9.2) + 0.15*u_time + u_mid),
                fbm(st + 3.5*q + vec2(8.3,2.8) + 0.13*u_time + u_treble));
  float f = fbm(st + 3.5*r);
  vec3 c = palette(f*0.9 + u_centroid + u_bass*0.3 + u_style*0.15);
  c *= 0.5 + 0.9*f;
  c += (q.x*q.x) * 0.25 * palette(u_time*0.2);
  c += u_beat * 0.25 * palette(f + u_time*0.3);
  return c;
}

// ---------- scene 3: spiral vortex ----------
vec3 sceneVortex(vec2 uv){
  float r = length(uv);
  float a = atan(uv.y, uv.x);
  a += r*(3.0 + u_bass*3.0) - u_time*0.6 + u_beat*2.0;
  vec2 suv = vec2(cos(a), sin(a)) * r;
  float n = fbm(suv*4.0 + u_time*0.25 + u_centroid*5.0);
  float beams = 0.5 + 0.5*sin(a*8.0 + u_time*1.5 + u_beat*3.0);
  vec3 c = palette(n + u_centroid + u_style*0.2) * (n*1.3 + 0.2);
  c *= smoothstep(1.25, 0.05, r);
  c += beams * 0.18 * palette(u_time*0.1);
  c += u_treble * 0.4 * palette(r*2.0 + u_time*0.2);
  return c * (0.7 + u_level*0.8);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;

  vec3 col;
  if(u_mode < 0.5)      col = sceneFractal(uv);
  else if(u_mode < 1.5) col = sceneTunnel(uv);
  else if(u_mode < 2.5) col = scenePlasma(uv);
  else                  col = sceneVortex(uv);

  // circular FFT spectrum ring overlay
  if(u_specOn > 0.5){
    float r = length(uv);
    float ang = atan(uv.y, uv.x);
    float af = ang/6.28318 + 0.5;
    float v = texture(u_spec, vec2(af, 0.5)).r;
    float inner = 0.62;
    float barLen = 0.40*v + 0.015;
    float d = r - inner;
    float edge = smoothstep(0.0,0.012,d) * (1.0 - smoothstep(barLen-0.04, barLen, d));
    col += palette(af*2.0 + u_time*0.1) * edge * (0.7 + v*2.2);
    col += palette(af + u_time*0.05) * smoothstep(0.007,0.0,abs(d)) * 0.7; // base ring
  }

  // feedback trails (phosphor persistence + swirl); damped under reduced-motion
  float rm = u_reducedMotion;
  vec2 c = gl_FragCoord.xy / u_res - 0.5;
  float zoom = 1.0 - (0.0035 + u_bass*0.012);
  float a = (0.004 + u_beat*0.02 + u_mid*0.01) * (1.0 - 0.85*rm);
  c *= rot(a) * zoom;
  float decay = mix(0.90 - u_beat*0.05, 0.15, rm);
  vec3 trail = texture(u_prev, c + 0.5).rgb * decay;
  col = max(col, trail);
  col += trail * 0.06 * (1.0 - rm);

  frag = vec4(col, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fsCopy">#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D u_tex;
uniform vec2 u_res;
vec3 tonemap(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec3 c = texture(u_tex, gl_FragCoord.xy/u_res).rgb;
  c = tonemap(c*1.15);
  c = pow(c, vec3(0.4545));
  vec2 uv = gl_FragCoord.xy/u_res;
  c *= mix(0.78, 1.0, smoothstep(1.15, 0.35, length(uv-0.5)));
  frag = vec4(c, 1.0);
}
</script>

<script>
"use strict";
const errEl = document.getElementById('err');
function fatal(msg){ errEl.style.display='block'; errEl.textContent = '⚠ '+msg; console.error(msg); }
window.addEventListener('error', e => fatal((e.message||'error')+(e.filename?('\n'+e.filename+':'+e.lineno):'')));

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false });
if(!gl){ fatal('WebGL2 is not available. Try Safari or Chrome on Apple Silicon.'); throw new Error('no webgl2'); }

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim()); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader compile error:\n'+gl.getShaderInfoLog(s));
  return s;
}
function program(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link error:\n'+gl.getProgramInfoLog(p));
  return p;
}
const vsSrc = document.getElementById('vs').textContent;
let progScene, progCopy;
try {
  progScene = program(vsSrc, document.getElementById('fsScene').textContent);
  progCopy  = program(vsSrc, document.getElementById('fsCopy').textContent);
} catch(e){ fatal(e.message); throw e; }

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ping-pong framebuffers
let texA, texB, fboA, fboB;
function makeTarget(w,h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo };
}
let W=0, H=0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.floor(window.innerWidth*dpr), h = Math.floor(window.innerHeight*dpr);
  if(w===W && h===H) return;
  W=w; H=h; canvas.width=w; canvas.height=h;
  const a=makeTarget(w,h), b=makeTarget(w,h);
  texA=a.tex; fboA=a.fbo; texB=b.tex; fboB=b.fbo;
  for(const f of [fboA,fboB]){ gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
}
window.addEventListener('resize', resize); resize();

// FFT spectrum texture (256 bins, R8)
const NBINS = 256;
const specTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, specTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, NBINS, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array(NBINS));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
let specData = new Uint8Array(NBINS);

function uni(p,n){ return gl.getUniformLocation(p,n); }
const U = {
  res:uni(progScene,'u_res'), time:uni(progScene,'u_time'),
  bass:uni(progScene,'u_bass'), mid:uni(progScene,'u_mid'),
  treble:uni(progScene,'u_treble'), level:uni(progScene,'u_level'),
  centroid:uni(progScene,'u_centroid'), beat:uni(progScene,'u_beat'),
  style:uni(progScene,'u_style'), mode:uni(progScene,'u_mode'),
  specOn:uni(progScene,'u_specOn'), prev:uni(progScene,'u_prev'), spec:uni(progScene,'u_spec'),
  reducedMotion:uni(progScene,'u_reducedMotion'),
};
const UC = { tex:uni(progCopy,'u_tex'), res:uni(progCopy,'u_res') };

// ---------- AUDIO ----------
let audioCtx=null, analyser=null, freq=null, masterVol=null;
let srcNode=null, demoNodes=null, playing=true, isDemo=false;
const bands={bass:0,mid:0,treble:0,level:0,centroid:0};
let bassAvg=0.0001, beat=0;

// ---- persist last loaded audio file across reloads (IndexedDB, not localStorage: audio > 5MB quota) ----
const IDB_DB='resomance', IDB_STORE='audio', IDB_KEY='last';
let pendingRestore=null;
function idbOpen(){
  return new Promise((res)=>{
    const r=indexedDB.open(IDB_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
  });
}
async function idbGetAudio(){
  const db=await idbOpen(); if(!db) return null;
  return new Promise((res)=>{ try{
    const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess=()=>res(req.result||null); req.onerror=()=>res(null);
  }catch(e){ res(null); } finally{ try{db.close();}catch(_){} } });
}
async function idbSaveAudio(file){
  const db=await idbOpen(); if(!db) return;
  try{ const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({blob:file,name:file.name,type:file.type,size:file.size},IDB_KEY);
    tx.oncomplete=()=>{ try{db.close();}catch(_){} }; tx.onerror=()=>{ try{db.close();}catch(_){} };
  }catch(e){ try{db.close();}catch(_){} }
}
function setTrackName(name){ document.getElementById('sub').textContent=name; }
// restore on load (no autoplay — browsers block audio without a gesture; resumes on first click)
idbGetAudio().then(rec=>{
  if(rec && rec.blob){
    pendingRestore=new File([rec.blob], rec.name||'track', {type:rec.type||'audio/*'});
    setTrackName(pendingRestore.name + '  ·  click to resume');
  }
});

function ensureCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.82;
    freq = new Uint8Array(analyser.frequencyBinCount);
    masterVol = audioCtx.createGain();
    const v = parseFloat(localStorage.getItem('resomance_vol'));
    masterVol.gain.value = isNaN(v)?0.9:v;
    // analyser taps the FULL pre-volume signal so the viz stays full at any listening level
    analyser.connect(masterVol);
    masterVol.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function stopSources(){
  if(srcNode){ try{srcNode.stop();}catch(e){} try{srcNode.disconnect();}catch(e){} srcNode=null; }
  if(demoNodes){ demoNodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} try{n.disconnect();}catch(e){} }); demoNodes=null; }
  isDemo=false;
}

function playFile(file){
  ensureCtx(); stopSources();
  const reader = new FileReader();
  reader.onload = () => {
    audioCtx.decodeAudioData(reader.result.slice(0)).then(buf=>{
      srcNode = audioCtx.createBufferSource();
      srcNode.buffer = buf; srcNode.loop = true;
      srcNode.connect(analyser);
      srcNode.start(); playing=true; isDemo=false; updatePlayBtn();
      setTrackName(file.name);
      idbSaveAudio(file);   // persist for next load
    }).catch(e=> fatal('Could not decode audio: '+e.message));
  };
  reader.readAsArrayBuffer(file);
}

function startDemo(){
  ensureCtx(); stopSources();
  const mix = audioCtx.createGain(); mix.gain.value = 0.0;
  mix.connect(analyser);
  const oscs=[]; const roots=[55,82.4,110,164.8];
  roots.forEach((f,i)=>{
    const o=audioCtx.createOscillator(); o.type=i%2?'sawtooth':'triangle';
    o.frequency.value=f; o.detune.value=(i-1.5)*8;
    const g=audioCtx.createGain(); g.gain.value=0.18/(i+1);
    o.connect(g); g.connect(mix); o.start(); oscs.push(o);
  });
  const nb=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*0.5;
  const noise=audioCtx.createBufferSource(); noise.buffer=nb; noise.loop=true;
  const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
  const ng=audioCtx.createGain(); ng.gain.value=0.05;
  noise.connect(hp); hp.connect(ng); ng.connect(mix); noise.start();
  const lfo=audioCtx.createOscillator(); lfo.frequency.value=2.0;
  const lfoG=audioCtx.createGain(); lfoG.gain.value=0.5;
  const baseG=audioCtx.createConstantSource(); baseG.offset.value=0.5;
  baseG.connect(mix.gain); lfo.connect(lfoG); lfoG.connect(mix.gain); lfo.start(); baseG.start();
  const arp=audioCtx.createOscillator(); arp.type='square'; arp.frequency.value=440;
  const arpG=audioCtx.createGain(); arpG.gain.value=0.0;
  arp.connect(arpG); arpG.connect(mix); arp.start();
  const scale=[220,277,330,440,554,659,880]; let step=0;
  const arpTimer=setInterval(()=>{
    if(!audioCtx) return;
    arp.frequency.setTargetAtTime(scale[step%scale.length], audioCtx.currentTime, 0.01);
    arpG.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.01);
    arpG.gain.setTargetAtTime(0.0, audioCtx.currentTime+0.12, 0.05);
    step++;
  },250);
  const sweep=audioCtx.createBiquadFilter(); sweep.type='lowpass'; sweep.frequency.value=800;
  mix.disconnect(); mix.connect(sweep); sweep.connect(analyser);
  const sweepLfo=audioCtx.createOscillator(); sweepLfo.frequency.value=0.08;
  const sweepG=audioCtx.createGain(); sweepG.gain.value=900;
  sweepLfo.connect(sweepG); sweepG.connect(sweep.frequency); sweepLfo.start();
  mix.gain.setTargetAtTime(0.9, audioCtx.currentTime, 0.5);
  const timerKiller={ stop(){ clearInterval(arpTimer); }, disconnect(){} };
  demoNodes=[...oscs, noise, lfo, baseG, arp, sweepLfo, timerKiller];
  isDemo=true; playing=true; updatePlayBtn();
}

function analyze(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freq);
  const n=freq.length;
  const bassEnd=Math.floor(n*0.06), midEnd=Math.floor(n*0.30);
  let b=0,m=0,tr=0,sum=0,wsum=0,total=0;
  for(let i=0;i<n;i++){
    const v=freq[i]/255; sum+=v; total+=v; wsum+=v*i;
    if(i<bassEnd) b+=v; else if(i<midEnd) m+=v; else tr+=v;
  }
  bands.bass=b/Math.max(1,bassEnd);
  bands.mid=m/Math.max(1,midEnd-bassEnd);
  bands.treble=tr/Math.max(1,n-midEnd);
  bands.level=sum/n;
  bands.centroid=total>0 ? (wsum/total)/n : 0.5;
  // first NBINS of spectrum for the ring (log-ish weighting toward audible range)
  for(let i=0;i<NBINS;i++){ specData[i]=freq[i]; }

  bassAvg=bassAvg*0.94+bands.bass*0.06;
  if(bands.bass>bassAvg*1.35 && bands.bass>0.12) beat=1.0;
  beat*=0.90;
}

// ---------- RENDER ----------
// accessibility: respect OS reduced-motion (calm swirl, trails, and beat flashes)
let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e=> reducedMotion=e.matches);
let t0=performance.now(), lastUI=0;
// persisted look settings (volume is persisted separately in its own handler)
let curMode = (()=>{ const m=parseInt(localStorage.getItem('resomance_scene'),10); return (m>=0&&m<=3)?m:0; })();
let curStyle = (()=>{ const s=parseFloat(localStorage.getItem('resomance_palette')); return (s>=0&&s<=3)?s:0; })();
let ringOn = localStorage.getItem('resomance_ring') !== '0';
let autoHide = localStorage.getItem('resomance_autohide') !== '0';
function frame(now){
  const time=(now-t0)/1000;
  analyze(); resize();

  // upload spectrum
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NBINS, 1, gl.RED, gl.UNSIGNED_BYTE, specData);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fboB);
  gl.viewport(0,0,W,H);
  gl.useProgram(progScene); gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA);
  gl.uniform1i(U.prev,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.uniform1i(U.spec,1);
  gl.uniform2f(U.res,W,H); gl.uniform1f(U.time,time);
  gl.uniform1f(U.bass,bands.bass); gl.uniform1f(U.mid,bands.mid);
  gl.uniform1f(U.treble,bands.treble); gl.uniform1f(U.level,bands.level);
  gl.uniform1f(U.centroid,bands.centroid); gl.uniform1f(U.beat, reducedMotion?beat*0.2:beat);
  gl.uniform1f(U.style,curStyle); gl.uniform1f(U.mode,curMode);
  gl.uniform1f(U.specOn, ringOn?1:0);
  gl.uniform1f(U.reducedMotion, reducedMotion?1:0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.useProgram(progCopy);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texB);
  gl.uniform1i(UC.tex,0); gl.uniform2f(UC.res,W,H);
  gl.drawArrays(gl.TRIANGLES,0,3);

  let t2=texA; texA=texB; texB=t2; let f2=fboA; fboA=fboB; fboB=f2;
  if(now-lastUI>50){ lastUI=now; updateMeters(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- HUD ----------
function buildMeters(el,n){ for(let i=0;i<n;i++) el.appendChild(document.createElement('i')); }
buildMeters(document.getElementById('mBass'),14);
buildMeters(document.getElementById('mMid'),14);
buildMeters(document.getElementById('mTreble'),14);
function paintMeter(el,val){ const b=el.children, lit=Math.round(val*14);
  for(let i=0;i<b.length;i++){ b[i].style.height=(i<lit?(3+(i/b.length)*23):2)+'px'; b[i].style.opacity=i<lit?1:0.25; } }
function updateMeters(){
  paintMeter(document.getElementById('mBass'),bands.bass);
  paintMeter(document.getElementById('mMid'),bands.mid);
  paintMeter(document.getElementById('mTreble'),bands.treble);
}

// ---------- CONTROLS ----------
const ui=document.getElementById('ui'), hintEl=document.getElementById('hint');
// idle fade: hide the HUD after 10s of inactivity, reveal on any input
const IDLE_MS=10000;
let idleTimer=null;
function showUI(){ ui.classList.add('show'); hintEl.classList.add('show'); }
function hideUI(){ ui.classList.remove('show'); hintEl.classList.remove('show'); }
function poke(){ showUI(); clearTimeout(idleTimer); if(autoHide) idleTimer=setTimeout(hideUI, IDLE_MS); }
['pointermove','pointerdown','wheel','touchstart'].forEach(ev=> window.addEventListener(ev, poke, {passive:true}));
poke();
document.getElementById('file').addEventListener('change', e=>{ if(e.target.files[0]) playFile(e.target.files[0]); });
document.getElementById('demo').addEventListener('click', startDemo);
const playBtn=document.getElementById('play');
function updatePlayBtn(){ playBtn.textContent = playing?'⏸ Pause':'▶ Play'; }
playBtn.addEventListener('click', ()=>{
  if(!audioCtx){ startDemo(); return; }
  if(playing){ audioCtx.suspend(); playing=false; } else { audioCtx.resume(); playing=true; }
  updatePlayBtn();
});
// scene segmented buttons
const modeSeg=document.getElementById('modeSeg');
function setMode(m){ curMode=m;
  [...modeSeg.children].forEach(x=>x.classList.toggle('on', parseInt(x.dataset.mode,10)===m));
  localStorage.setItem('resomance_scene', String(m)); }
modeSeg.addEventListener('click', e=>{ const b=e.target.closest('button[data-mode]'); if(b) setMode(parseInt(b.dataset.mode,10)); });
// palette
const styleSel=document.getElementById('style');
function setStyle(s){ curStyle=s; styleSel.value=String(s); localStorage.setItem('resomance_palette', String(s)); }
styleSel.addEventListener('change', e=> setStyle(parseFloat(e.target.value)));
// ring toggle
const ringChk=document.getElementById('ring');
function setRing(on){ ringOn=on; ringChk.checked=on; localStorage.setItem('resomance_ring', on?'1':'0'); }
ringChk.addEventListener('change', e=> setRing(e.target.checked));
// auto-hide HUD toggle
const autohideChk=document.getElementById('autohide');
autohideChk.addEventListener('change', e=>{ autoHide=e.target.checked; localStorage.setItem('resomance_autohide', autoHide?'1':'0'); if(!autoHide) showUI(); });
// sync UI to persisted look on load
[...modeSeg.children].forEach(x=>x.classList.toggle('on', parseInt(x.dataset.mode,10)===curMode));
styleSel.value=String(curStyle); ringChk.checked=ringOn; autohideChk.checked=autoHide;
// volume
const volSlider=document.getElementById('vol'), volLbl=document.getElementById('volLbl');
const savedVol=parseFloat(localStorage.getItem('resomance_vol'));
if(!isNaN(savedVol)){ volSlider.value=savedVol; volLbl.textContent=Math.round(savedVol*100)+'%'; }
volSlider.addEventListener('input', e=>{
  const v=parseFloat(e.target.value);
  if(masterVol) masterVol.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  volLbl.textContent=Math.round(v*100)+'%';
  localStorage.setItem('resomance_vol', String(v));
});
// keyboard
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.key==='h'||e.key==='H'){
    // manual toggle: hide now and stay hidden until the next pointer/key activity
    if(ui.classList.contains('show')){ hideUI(); clearTimeout(idleTimer); }
    else { poke(); }
    return;
  }
  if(e.key>='1'&&e.key<='4') setMode(parseInt(e.key,10)-1);
  if(e.key==='r'||e.key==='R') setRing(!ringOn);
  poke();   // any other key counts as activity
});

// drag & drop
const drop=document.getElementById('drop');
window.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('on'); });
window.addEventListener('dragleave', e=>{ if(e.relatedTarget===null) drop.classList.remove('on'); });
window.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('on');
  const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('audio')) playFile(f); });

// auto-start demo after first gesture (browsers require a user gesture for audio)
function firstGesture(){
  if(pendingRestore){ const f=pendingRestore; pendingRestore=null; playFile(f); }
  else startDemo();
  window.removeEventListener('pointerdown',firstGesture); window.removeEventListener('keydown',firstGesture);
}
window.addEventListener('pointerdown', firstGesture);
window.addEventListener('keydown', firstGesture);
</script>
</body>
</html>
