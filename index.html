<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #000; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #ui {

    padding: 18px; opacity: 0; transition: opacity .4s ease;

  #ui.show { opacity: 1; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel {
    pointer-events: auto;
    background: rgba(8,10,18,.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(140,170,255,.18); border-radius: 12px;
    padding: 12px 14px; color: #cdd6ff; font-size: 12px; line-height: 1.5;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  button, label.btn {
    pointer-events: auto; cursor: pointer; user-select: none;
    background: linear-gradient(180deg, rgba(80,110,255,.25), rgba(40,60,180,.18));
    border: 1px solid rgba(150,180,255,.35); color: #eaf0ff;
    padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 12px;
    transition: transform .08s ease, background .2s ease;
  }
  button:hover, label.btn:hover { background: linear-gradient(180deg, rgba(110,140,255,.4), rgba(60,90,220,.28)); }
  button:active { transform: translateY(1px) scale(.99); }
  input[type=file] { display: none; }
  .seg { display:flex; gap:0; border:1px solid rgba(150,180,255,.3); border-radius:9px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:8px 10px; background:rgba(20,26,48,.6); font-size:11px; opacity:.7; }
  .seg button.on { background:linear-gradient(180deg,rgba(110,140,255,.45),rgba(60,90,220,.3)); opacity:1; }

  #title { font-weight: 700; letter-spacing: .18em; font-size: 13px; color: #aebeff; }
  #sub { color: #8a96c8; font-size: 11px; letter-spacing: .04em; }
  .meter { display: inline-flex; gap: 3px; align-items: flex-end; height: 26px; }
  .meter i { width: 5px; background: linear-gradient(180deg,#6f8bff,#b76bff); border-radius: 2px; height: 2px; transition: height .05s linear; }
  .label { color:#7f8bc0; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color:#9aa6da; font-size:11px; letter-spacing:.1em; opacity:0; pointer-events:none;
    text-align:center; transition: opacity .4s ease; }
  #hint.show { opacity:.7; }
  #toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(8,10,18,.72); border:1px solid rgba(150,180,255,.3); color:#dfe6ff;
    padding:8px 14px; border-radius:10px; font-size:12px; letter-spacing:.06em;
    opacity:0; transition: opacity .25s ease; pointer-events:none; z-index:45; white-space:nowrap; }
  #toast.show { opacity:.95; }
  /* hidden HUD must not intercept clicks (e.g. after the idle fade-out) */
  #ui:not(.show) * { pointer-events: none; }
  #err {
    position: fixed; inset: auto 16px 16px 16px; max-width: 760px; margin: 0 auto;
    background: #2a0d12; border: 1px solid #ff5d6c; color: #ffd7db;
    padding: 14px 16px; border-radius: 12px; font-size: 12px; white-space: pre-wrap;
    display: none; pointer-events: auto; z-index: 50;
  }
  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,80,.35); border: 2px dashed rgba(150,180,255,.5);
    color: #dfe6ff; font-size: 18px; letter-spacing: .1em; z-index: 40; pointer-events: none;
  }
  #drop.on { display: flex; }
  select { pointer-events:auto; background: rgba(20,26,48,.8); color:#dfe6ff; border:1px solid rgba(150,180,255,.3); border-radius:8px; padding:6px 8px; font:inherit; font-size:12px; }

  /* volume slider */
  .vol { display:flex; align-items:center; gap:8px; }
  input[type=range] {
    pointer-events:auto; -webkit-appearance:none; appearance:none;
    width:110px; height:4px; border-radius:3px;
    background: linear-gradient(90deg,#6f8bff,#b76bff); outline:none;

<script type="x-shader/x-vertex" id="vs">#version 300 es
in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<script type="x-shader/x-fragment" id="fsScene">#version 300 es
precision highp float;
out vec4 frag;

uniform vec2  u_res;
uniform float u_time;
uniform float u_bass;
uniform float u_mid;
uniform float u_treble;
uniform float u_level;
uniform float u_centroid;
uniform float u_beat;
uniform float u_snare;
uniform float u_hat;
uniform float u_paletteShift;
uniform float u_style;
uniform float u_mode;
uniform float u_specOn;
uniform float u_reducedMotion;
uniform float u_feedback;
uniform float u_swirl;
uniform float u_glow;
uniform int u_rmSteps;
uniform vec3 u_pa, u_pb, u_pc, u_pd;   // custom cosine-palette vectors
uniform sampler2D u_prev;
uniform sampler2D u_spec;   // R8, 256x1 FFT magnitudes

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

vec3 palette(float t){
  vec3 a, b, c, d;
  if(u_style > 3.5){ a=u_pa; b=u_pb; c=u_pc; d=u_pd; }            // user-edited custom palette
  else if(u_style < 0.5){ a=vec3(0.5); b=vec3(0.5); c=vec3(1.0); d=vec3(0.00,0.33,0.67); }
  else if(u_style < 1.5){ a=vec3(0.6,0.4,0.5); b=vec3(0.5); c=vec3(1.0); d=vec3(0.30,0.20,0.55); }
  else if(u_style < 2.5){ a=vec3(0.4,0.5,0.6); b=vec3(0.5); c=vec3(1.0); d=vec3(0.55,0.55,0.85); }
  else { a=vec3(0.7,0.35,0.2); b=vec3(0.5); c=vec3(1.0); d=vec3(0.10,0.45,0.75); }
  return a + b*cos(6.28318*(c*t + d) + u_paletteShift);
}

float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),       hash21(i+vec2(1,0)), u.x),
             mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=0.5; }
  return v;
}

// ---------- scene 0: kaleidoscopic IFS fractal ----------
float map0(vec3 p){
  p.xy *= rot(u_time*0.10 + u_beat*1.5);
  p.xz *= rot(u_time*0.07 - u_beat*0.8);
  float s = 2.0 + u_bass*1.4 + u_beat*0.6;
  vec3 offset = vec3(1.0 - u_mid*0.35, 1.0 - u_treble*0.35, 1.0);
  float scale = 1.0;
  for(int i=0;i<11;i++){
    p = abs(p);
    if(p.x < p.y) p.xy = p.yx;
    if(p.x < p.z) p.xz = p.zx;
    if(p.y < p.z) p.yz = p.zy;
    p = p*s - offset*(s-1.0);
    p.xy *= rot(0.27 + u_mid*0.5);
    scale *= s;
  }
  return (length(p) - 0.6) / scale;
}
vec3 sceneFractal(vec2 uv){
  float camDist = 3.6 - u_bass*1.1 - u_beat*0.4;
  vec3 ro = vec3(0.0, 0.0, camDist);
  ro.xz *= rot(u_time*0.12 + u_centroid*1.2);
  ro.y = sin(u_time*0.18)*0.6;
  vec3 fwd = normalize(-ro);
  vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up  = cross(fwd, rgt);
  vec3 rd = normalize(uv.x*rgt + uv.y*up + 1.4*fwd);

  float t = 0.0, glow = 0.0, steps = 0.0;
  bool hit = false; vec3 p = vec3(0.0);
  for(int i=0;i<120;i++){
    if(i>=u_rmSteps) break;
    p = ro + rd*t;
    float d = map0(p);
    glow += exp(-d*7.0) * (0.012 + u_level*0.05);
    if(d < 0.0012){ hit = true; break; }
    t += d*0.9; steps += 1.0;
    if(t > 18.0) break;
  }
  vec3 col = vec3(0.0);
  if(hit){
    vec2 e = vec2(0.0009,0.0);
    vec3 n = normalize(vec3(map0(p+e.xyy)-map0(p-e.xyy), map0(p+e.yxy)-map0(p-e.yxy), map0(p+e.yyx)-map0(p-e.yyx)));
    vec3 lig = normalize(vec3(0.6,0.75,-0.45));
    float dif = clamp(dot(n,lig),0.0,1.0);
    float fre = pow(1.0-clamp(dot(n,-rd),0.0,1.0),3.0);
    float ao = 1.0 - steps/float(u_rmSteps);
    vec3 base = palette(u_centroid*0.6 + t*0.04 + u_time*0.04 + u_style*0.2);
    col = base*(0.18+0.9*dif)*ao + fre*palette(u_time*0.1+0.5)*(0.6+u_treble*1.4) + base*0.15*u_beat;
  } else {
    float r = length(uv);
    col = palette(u_centroid*0.5 + r*0.6 + u_time*0.03) * (0.04 + 0.10/(r+0.4)) * (0.4 + u_level);
    col += palette(u_time*0.05) * u_treble * 0.06;
  }
  col += glow * palette(u_time*0.08 + 0.3) * (1.0 + u_bass*2.0);
  return col;
}

// ---------- scene 1: hyperdrive tunnel ----------
vec3 sceneTunnel(vec2 uv){
  vec3 ro = vec3(sin(u_time*0.5)*0.3, cos(u_time*0.37)*0.3, 0.0) * (0.5 + u_bass);
  vec3 rd = normalize(vec3(uv, 1.3));
  float t = 0.0, glow = 0.0; bool hit = false; vec3 p = vec3(0.0);
  for(int i=0;i<120;i++){
    if(i>=u_rmSteps) break;
    p = ro + rd*t;
    p.z += u_time*4.0;                 // fly forward
    float R = 1.6 + 0.25*sin(p.z*2.0 + u_time) + u_bass*0.6;
    float d = R - length(p.xy);        // >0 inside, <0 past wall
    glow += exp(-max(d,0.0)*3.0)*0.012 + exp(-abs(d)*9.0)*0.006;
    if(d < 0.02){ hit = true; break; }
    t += max(d*0.9, 0.015);
    if(t > 40.0) break;
  }
  vec3 col = vec3(0.0);
  if(hit){
    float ring = sin(p.z*1.5 + u_time*2.0)*0.5+0.5;
    vec3 base = palette(p.z*0.05 + u_time*0.06 + u_centroid);
    col = base*(0.25 + ring*0.85);
    col += palette(u_time*0.1) * u_treble * 0.5;
    col *= exp(-t*0.06);
  }
  col += glow * palette(u_time*0.2 + 0.4) * (1.0 + u_bass*1.5);
  return col;
}

// ---------- scene 2: liquid plasma ----------
vec3 scenePlasma(vec2 uv){
  vec2 st = uv * (1.6 + u_bass*0.6);
  st *= rot(u_time*0.05);
  vec2 q = vec2(fbm(st + 0.12*u_time), fbm(st + vec2(5.2,1.3) + 0.10*u_time));
  vec2 r = vec2(fbm(st + 3.5*q + vec2(1.7,9.2) + 0.15*u_time + u_mid),
                fbm(st + 3.5*q + vec2(8.3,2.8) + 0.13*u_time + u_treble));
  float f = fbm(st + 3.5*r);
  vec3 c = palette(f*0.9 + u_centroid + u_bass*0.3 + u_style*0.15);
  c *= 0.5 + 0.9*f;
  c += (q.x*q.x) * 0.25 * palette(u_time*0.2);
  c += u_beat * 0.25 * palette(f + u_time*0.3);
  return c;
}

// ---------- scene 3: spiral vortex ----------
vec3 sceneVortex(vec2 uv){
  float r = length(uv);
  float a = atan(uv.y, uv.x);
  a += r*(3.0 + u_bass*3.0) - u_time*0.6 + u_beat*2.0;
  vec2 suv = vec2(cos(a), sin(a)) * r;
  float n = fbm(suv*4.0 + u_time*0.25 + u_centroid*5.0);
  float beams = 0.5 + 0.5*sin(a*8.0 + u_time*1.5 + u_beat*3.0);
  vec3 c = palette(n + u_centroid + u_style*0.2) * (n*1.3 + 0.2);
  c *= smoothstep(1.25, 0.05, r);
  c += beams * 0.18 * palette(u_time*0.1);
  c += u_treble * 0.4 * palette(r*2.0 + u_time*0.2);
  return c * (0.7 + u_level*0.8);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;

  vec3 col;
  if(u_mode < 0.5)      col = sceneFractal(uv);
  else if(u_mode < 1.5) col = sceneTunnel(uv);
  else if(u_mode < 2.5) col = scenePlasma(uv);
  else                  col = sceneVortex(uv);

  // snare / hat onset accents (spectral-flux onsets) for richer reactivity
  col += palette(u_time*0.15 + 0.2) * u_snare * 0.10;
  col += palette(u_time*0.35 + 0.6) * u_hat   * 0.06;

  // circular FFT spectrum ring overlay
  if(u_specOn > 0.5){
    float r = length(uv);
    float ang = atan(uv.y, uv.x);
    float af = ang/6.28318 + 0.5;
    float v = texture(u_spec, vec2(af, 0.5)).r;
    float inner = 0.62;
    float barLen = 0.40*v + 0.015;
    float d = r - inner;
    float edge = smoothstep(0.0,0.012,d) * (1.0 - smoothstep(barLen-0.04, barLen, d));
    col += palette(af*2.0 + u_time*0.1) * edge * (0.7 + v*2.2);
    col += palette(af + u_time*0.05) * smoothstep(0.007,0.0,abs(d)) * 0.7; // base ring
  }

  // feedback trails (phosphor persistence + swirl); damped under reduced-motion
  float rm = u_reducedMotion;
  vec2 c = gl_FragCoord.xy / u_res - 0.5;
  float zoom = 1.0 - (0.0035 + u_bass*0.012);
  float a = (u_swirl + u_beat*0.02 + u_mid*0.01) * (1.0 - 0.85*rm);
  c *= rot(a) * zoom;
  float decay = mix(u_feedback - u_beat*0.05, 0.15, rm);
  vec3 trail = texture(u_prev, c + 0.5).rgb * decay;
  col = max(col, trail);
  col += trail * u_glow * (1.0 - rm);

  frag = vec4(col, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fsCopy">#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D u_tex;
uniform vec2 u_res;
vec3 tonemap(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec3 c = texture(u_tex, gl_FragCoord.xy/u_res).rgb;
  c = tonemap(c*1.15);
  c = pow(c, vec3(0.4545));
  vec2 uv = gl_FragCoord.xy/u_res;

// ---------- HUD ----------

buildMeters(document.getElementById('mTreble'),14);
function paintMeter(el,val){ const b=el.children, lit=Math.round(val*14);
  for(let i=0;i<b.length;i++){ b[i].style.height=(i<lit?(3+(i/b.length)*23):2)+'px'; b[i].style.opacity=i<lit?1:0.25; } }
function updateMeters(){
  paintMeter(document.getElementById('mBass'),bands.bass);
  paintMeter(document.getElementById('mMid'),bands.mid);
  paintMeter(document.getElementById('mTreble'),bands.treble);
}

// ---------- CONTROLS ----------
const ui=document.getElementById('ui'), hintEl=document.getElementById('hint'), toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1400); }
function toggleFullscreen(){
  const isFs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isFs){ const rq=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
    if(rq){ try{ const p=rq.call(document.documentElement); if(p&&p.catch) p.catch(()=>{}); toast('fullscreen'); }catch(e){} } }
  else { const ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex){ try{ ex.call(document); toast('windowed'); }catch(e){} } }
}
// idle fade: hide the HUD after 10s of inactivity, reveal on any input
const IDLE_MS=10000;
let idleTimer=null;
function showUI(){ ui.classList.add('show'); hintEl.classList.add('show'); }
function hideUI(){ ui.classList.remove('show'); hintEl.classList.remove('show'); }
function poke(){ showUI(); clearTimeout(idleTimer); if(autoHide) idleTimer=setTimeout(hideUI, IDLE_MS); }
['pointermove','pointerdown','wheel','touchstart'].forEach(ev=> window.addEventListener(ev, poke, {passive:true}));
poke();
document.getElementById('file').addEventListener('change', e=>{ if(e.target.files.length) loadFiles(e.target.files); });
document.getElementById('demo').addEventListener('click', startDemo);
const playBtn=document.getElementById('play');
function updatePlayBtn(){ playBtn.textContent = playing?'⏸ Pause':'▶ Play'; }
playBtn.addEventListener('click', ()=>{
  if(!audioCtx){ startDemo(); return; }
  if(playing){ audioCtx.suspend(); playing=false; } else { audioCtx.resume(); playing=true; }
  updatePlayBtn();
});
// ---------- transport: seek bar (file playback only) ----------
const seekRow=document.getElementById('seekRow'), seekEl=document.getElementById('seek'),
      curTimeEl=document.getElementById('curTime'), totTimeEl=document.getElementById('totTime');
function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return (h>0? h+':'+String(m).padStart(2,'0') : String(m))+':'+String(sec).padStart(2,'0'); }
function showSeek(on){ seekRow.style.display = on?'flex':'none'; if(on) totTimeEl.textContent=fmtTime(trackDur); }
// jump to frac (0..1) of the buffer by recreating the source at that offset
function seekTo(frac){
  if(!curBuffer||!audioCtx) return;
  const off=Math.max(0,Math.min(frac,0.999))*trackDur;
  try{ if(srcNode){ srcNode.onended=null; srcNode.stop(); srcNode.disconnect(); } }catch(e){}
  srcNode=audioCtx.createBufferSource(); srcNode.buffer=curBuffer; srcNode.loop=true; srcNode.connect(analyser);
  startCtxTime=audioCtx.currentTime-off;   // currentTime is frozen while suspended, so this works paused too
  srcNode.start(0, off);
}
function updateSeek(){
  if(!curBuffer||!audioCtx||seeking) return;
  const el=(audioCtx.currentTime-startCtxTime)%trackDur;
  seekEl.value=String(Math.round(el/trackDur*1000));
  curTimeEl.textContent=fmtTime(el);
}
seekEl.addEventListener('input', ()=>{ seeking=true; if(curBuffer) curTimeEl.textContent=fmtTime(parseFloat(seekEl.value)/1000*trackDur); });
seekEl.addEventListener('change', ()=>{ if(curBuffer) seekTo(parseFloat(seekEl.value)/1000); seeking=false; });
// prev / next + track counter
const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next'), trackCountEl=document.getElementById('trackCount');
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);
function updateTrackCounter(){ const multi=playlist.length>1; trackCountEl.textContent = multi ? (curIdx+1)+' / '+playlist.length : ''; prevBtn.disabled=nextBtn.disabled=!multi; }
// scene segmented buttons
const modeSeg=document.getElementById('modeSeg');
function setMode(m){ curMode=m;
  [...modeSeg.children].forEach(x=>x.classList.toggle('on', parseInt(x.dataset.mode,10)===m));
  localStorage.setItem('resomance_scene', String(m)); }
modeSeg.addEventListener('click', e=>{ const b=e.target.closest('button[data-mode]'); if(b) setMode(parseInt(b.dataset.mode,10)); });
// palette
const styleSel=document.getElementById('style');
function setStyle(s){ curStyle=s; styleSel.value=String(s); localStorage.setItem('resomance_palette', String(s)); syncPalEditor(); }
styleSel.addEventListener('change', e=> setStyle(parseFloat(e.target.value)));
// custom palette editor: a/b/c/d color pickers
[['cpA','a'],['cpB','b'],['cpC','c'],['cpD','d']].forEach(([id,k])=> document.getElementById(id).addEventListener('input', e=>{ customPal[k]=h2v(e.target.value); localStorage.setItem('resomance_custompal', JSON.stringify(customPal)); }));
// ring toggle
const ringChk=document.getElementById('ring');
function setRing(on){ ringOn=on; ringChk.checked=on; localStorage.setItem('resomance_ring', on?'1':'0'); }
ringChk.addEventListener('change', e=> setRing(e.target.checked));
// auto-hide HUD toggle
const autohideChk=document.getElementById('autohide');
autohideChk.addEventListener('change', e=>{ autoHide=e.target.checked; localStorage.setItem('resomance_autohide', autoHide?'1':'0'); if(!autoHide) showUI(); });
// sync UI to persisted look on load
[...modeSeg.children].forEach(x=>x.classList.toggle('on', parseInt(x.dataset.mode,10)===curMode));
styleSel.value=String(curStyle); ringChk.checked=ringOn; autohideChk.checked=autoHide; syncPalEditor();
// volume
const volSlider=document.getElementById('vol'), volLbl=document.getElementById('volLbl');
const savedVol=parseFloat(localStorage.getItem('resomance_vol'));
if(!isNaN(savedVol)){ volSlider.value=savedVol; volLbl.textContent=Math.round(savedVol*100)+'%'; }
volSlider.addEventListener('input', e=>{
  const v=parseFloat(e.target.value);
  if(masterVol) masterVol.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  volLbl.textContent=Math.round(v*100)+'%';
  localStorage.setItem('resomance_vol', String(v));
});
// look panel: feedback / swirl / glow sliders, persisted like volume
const lookToggle=document.getElementById('lookToggle'), lookPanel=document.getElementById('lookPanel');
lookToggle.addEventListener('click', ()=> lookPanel.style.display = lookPanel.style.display==='none'?'flex':'none');
function bindLook(id,key){ const el=document.getElementById(id); el.value=look[key];
  el.addEventListener('input', e=>{ look[key]=parseFloat(e.target.value); localStorage.setItem('resomance_look', JSON.stringify(look)); }); }
bindLook('lkFeedback','feedback'); bindLook('lkSwirl','swirl'); bindLook('lkGlow','glow');
// quality preset (DPR cap + raymarch steps) + FPS meter
const qualSeg=document.getElementById('qualSeg');
function setQuality(i){ qualIdx=i; qual=QUAL[i]; localStorage.setItem('resomance_quality', String(i));
  [...qualSeg.children].forEach(b=>b.classList.toggle('on', parseInt(b.dataset.q,10)===i));
  W=H=0; resize(); }   // force re-alloc of render targets at the new DPR
qualSeg.addEventListener('click', e=>{ const b=e.target.closest('button[data-q]'); if(b) setQuality(parseInt(b.dataset.q,10)); });
[...qualSeg.children].forEach(b=>b.classList.toggle('on', parseInt(b.dataset.q,10)===qualIdx));
const fpsChk=document.getElementById('fpsChk'), fpsVal=document.getElementById('fpsVal');
let showFps = localStorage.getItem('resomance_fps')==='1';
fpsChk.checked=showFps; if(!showFps) fpsVal.textContent='';
fpsChk.addEventListener('change', e=>{ showFps=e.target.checked; localStorage.setItem('resomance_fps', showFps?'1':'0'); if(!showFps) fpsVal.textContent='--'; });
// beat-aware palette shift toggle (BPM estimate drives palette rotation)
const beatShiftChk=document.getElementById('beatShift'), bpmVal=document.getElementById('bpmVal');
let beatShiftOn = localStorage.getItem('resomance_beatshift')==='1';
beatShiftChk.checked=beatShiftOn; if(!beatShiftOn) bpmVal.textContent='--';
beatShiftChk.addEventListener('change', e=>{ beatShiftOn=e.target.checked; localStorage.setItem('resomance_beatshift', beatShiftOn?'1':'0'); if(!beatShiftOn) bpmVal.textContent='--'; });
// keyboard
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.key==='h'||e.key==='H'){
    // manual toggle: hide now and stay hidden until the next pointer/key activity
    if(ui.classList.contains('show')){ hideUI(); clearTimeout(idleTimer); }
    else { poke(); }
    return;
  }
  if(e.key>='1'&&e.key<='4') setMode(parseInt(e.key,10)-1);
  if(e.key==='r'||e.key==='R') setRing(!ringOn);
  if(e.key==='s'||e.key==='S') pendingShot=true;
  if(e.key==='f'||e.key==='F') toggleFullscreen();
  if((e.key==='ArrowRight'||e.key==='ArrowLeft') && document.activeElement!==seekEl){ e.preventDefault(); e.key==='ArrowRight'?nextTrack():prevTrack(); }
  poke();   // any other key counts as activity
});

// drag & drop
const drop=document.getElementById('drop');
window.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('on'); });
window.addEventListener('dragleave', e=>{ if(e.relatedTarget===null) drop.classList.remove('on'); });
window.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('on');
  const dt=e.dataTransfer;
  if(dt.items && dt.items.length && typeof dt.items[0].webkitGetAsEntry==='function'){
    const entries=[]; for(const it of dt.items){ const en=it.webkitGetAsEntry(); if(en) entries.push(en); }
    if(entries.length){ collectEntries(entries).then(loadFiles); return; }
  }
  if(dt.files && dt.files.length) loadFiles(dt.files);
});

// auto-start demo after first gesture (browsers require a user gesture for audio)
function firstGesture(){
  if(pendingRestore){ const f=pendingRestore; pendingRestore=null; loadFiles([f]); }
  else startDemo();
  window.removeEventListener('pointerdown',firstGesture); window.removeEventListener('keydown',firstGesture);
}
window.addEventListener('pointerdown', firstGesture);
window.addEventListener('keydown', firstGesture);
</script>
